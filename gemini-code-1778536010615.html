<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAQAM | مقام - A Grand Library of Arts & Humanities</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a090c;
            --gold: #c5a059;
            --gold-dim: #8e7345;
            --text-main: #d1d1d1;
            --text-dim: #888;
        }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 30%, rgba(197, 160, 89, 0.08) 0%, transparent 50%), url('https://www.transparenttextures.com/patterns/black-paper.png');
            color: var(--text-main);
            font-family: 'Playfair Display', serif;
            margin: 0; padding: 0;
        }
        .library-container {
            max-width: 1100px;
            margin: 0 auto;
            border-left: 1px solid rgba(197, 160, 89, 0.15);
            border-right: 1px solid rgba(197, 160, 89, 0.15);
            padding: 0 50px;
            min-height: 100vh;
        }
        header {
            padding: 60px 0; text-align: center; border-bottom: 1px double var(--gold-dim);
        }
        .logo-area h1 {
            font-family: 'Cinzel', serif; font-size: 4rem; color: var(--gold); margin: 0; letter-spacing: 10px;
        }
        .logo-area .arabic-logo {
            font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--gold-dim); display: block; direction: rtl;
        }
        .hero {
            display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; padding: 80px 0; border-bottom: 1px solid rgba(197,160,89,0.1);
        }
        .hero img {
            width: 100%; height: 450px; object-fit: cover; border: 1px solid var(--gold-dim);
        }
        .read-more-btn {
            display: inline-block; margin-top: 20px; color: var(--gold); text-decoration: none; font-family: 'Cinzel'; border-bottom: 1px solid var(--gold); padding-bottom: 5px; transition: 0.3s;
        }
        .read-more-btn:hover { letter-spacing: 2px; }
        footer {
            text-align: center; padding: 60px 0; font-family: 'Cinzel'; color: var(--text-dim); font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="library-container">
    <header>
        <div class="logo-area">
            <h1>MAQAM</h1>
            <span class="arabic-logo">مقام</span>
        </div>
    </header>
    <section class="hero">
        <img src="https://images.unsplash.com/photo-1461360228754-6e81c478bc88?q=80&w=2071" alt="Hero">
        <div>
            <span style="color:var(--gold-dim); font-family:Cinzel; letter-spacing: 2px;">Featured Essay</span>
            <h2 style="font-size:3rem; color:var(--gold); line-height:1.2;">The Shakespearean Sufi</h2>
            <p>How the sonnets of the West mirror the mystical longings of the East. An investigation into shared divinity.</p>
            <a href="article.html" class="read-more-btn">Enter the Archive →</a>
        </div>
    </section>
    <footer>
        &copy; 2026 MAQAM | FROM THE EAST TO THE WEST
    </footer>
</div>
</body>
</html>
